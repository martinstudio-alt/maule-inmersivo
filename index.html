<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MAULE INMERSO</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .inicio {

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 40px;
    }

    .titulo {

      color: white;

      font-size: clamp(
        40px,
        7vw,
        90px
      );

      font-weight: 600;

      letter-spacing: 8px;

      text-align: center;
    }

    .boton {

      padding: 18px 55px;

      font-size: 24px;

      border: 2px solid white;

      border-radius: 50px;

      background: transparent;

      color: white;

      cursor: pointer;
    }

    .boton:hover {

      background: white;

      color: black;
    }

  </style>

</head>


<body>

  <div class="inicio">

    <div class="titulo">
      MAULE INMERSO
    </div>

    <button
      class="boton"
      onclick="comenzar()">

      COMENZAR

    </button>

  </div>


  <script>

    function comenzar() {

      if (document.documentElement.requestFullscreen) {

        document.documentElement.requestFullscreen();

      }

    }

  </script>

</body>

</html>
<!-- MAULE INMERSO -->
