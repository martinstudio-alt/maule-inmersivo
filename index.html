<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAULE INMERSO</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }


    /* =========================
       INICIO
       ========================= */

    #inicio {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 40px;

      background: #000;
    }


    .titulo {
      color: white;

      font-size: clamp(40px, 7vw, 90px);

      font-weight: 600;

      letter-spacing: 8px;

      text-align: center;
    }


    .boton {
      padding: 18px 55px;

      font-size: 24px;

      border: 2px solid white;

      border-radius: 50px;

      background: transparent;

      color: white;

      cursor: pointer;
    }


    .boton:hover {
      background: white;
      color: black;
    }


    /* =========================
       MAPA
       ========================= */

    #mapaPantalla {

      display: none;

      width: 100%;
      height: 100%;

      background: #000;

      position: relative;

      align-items: center;
      justify-content: center;

      flex-direction: column;
    }


    .mapaContenedor {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .mapaContenedor img {

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* =========================
       ZONA INVISIBLE 01
       ========================= */

    .zona01 {

      position: absolute;

      left: 74%;
      top: 21%;

      width: 81px;
      height: 81px;

      background: transparent;

      border: none;

      outline: none;

      box-shadow: none;

      cursor: pointer;

      padding: 0;

      z-index: 30;
    }


    .zona01:hover {
      background: transparent;
      border: none;
      outline: none;
      box-shadow: none;
    }


    .zona01:focus {
      outline: none;
    }


    /* =========================
       VIDEO
       ========================= */

    #videoPantalla {

      display: none;

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #000;

      z-index: 100;

      align-items: center;
      justify-content: center;
    }


    #video01 {

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }


    /* =========================
       VOLVER
       ========================= */

    .volver {

      position: absolute;

      bottom: 30px;
      left: 30px;

      padding: 12px 28px;

      font-size: 18px;

      border: 1px solid white;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.6);

      color: white;

      cursor: pointer;

      z-index: 200;
    }


    .volver:hover {

      background: white;
      color: black;
    }

  </style>

</head>


<body>


  <!-- =========================
       PANTALLA INICIO
       ========================= -->

  <div id="inicio">

    <div class="titulo">
      MAULE INMERSO
    </div>


    <button
      class="boton"
      onclick="comenzar()">

      COMENZAR

    </button>

  </div>



  <!-- =========================
       PANTALLA MAPA
       ========================= -->

  <div id="mapaPantalla">


    <div class="mapaContenedor">

      <img
        src="IMAGENES/mapa.webp"
        alt="Mapa de la Región del Maule">

    </div>


    <!--
      ZONA INVISIBLE DEL PUNTO 01

      No se ve.
      El usuario toca directamente
      sobre el mapa.
    -->

    <button
      class="zona01"
      aria-label="Punto 01"
      onclick="abrirVideo01()">
    </button>


    <button
      class="volver"
      onclick="volverInicio()">

      VOLVER

    </button>

  </div>



  <!-- =========================
       VIDEO 01
       ========================= -->

  <div id="videoPantalla">


    <video
      id="video01"
      playsinline
      preload="auto">

      <source
        src="VIDEOS/video 01.mp4"
        type="video/mp4">

      Tu navegador no puede reproducir este video.

    </video>


  </div>



  <script>


    /* =========================
       COMENZAR
       ========================= */

    function comenzar() {

      document.getElementById("inicio").style.display = "none";

      document.getElementById("mapaPantalla").style.display = "flex";

      document.documentElement.requestFullscreen?.();

    }



    /* =========================
       ABRIR VIDEO 01
       ========================= */

    function abrirVideo01() {

      const mapa =
        document.getElementById("mapaPantalla");

      const pantallaVideo =
        document.getElementById("videoPantalla");

      const video =
        document.getElementById("video01");


      /* Ocultar mapa */

      mapa.style.display = "none";


      /* Mostrar video */

      pantallaVideo.style.display = "flex";


      /* Comenzar desde el principio */

      video.currentTime = 0;


      /* Reproducir */

      video.play().catch(function(error) {

        console.log(
          "No se pudo iniciar el video:",
          error
        );

      });

    }



    /* =========================
       VIDEO TERMINADO
       ========================= */

    document
      .getElementById("video01")
      .addEventListener(
        "ended",
        function() {

          this.pause();

          this.currentTime = 0;


          /* Ocultar video */

          document
            .getElementById("videoPantalla")
            .style.display = "none";


          /* Volver al mapa */

          document
            .getElementById("mapaPantalla")
            .style.display = "flex";

        }
      );



    /* =========================
       VOLVER AL INICIO
       ========================= */

    function volverInicio() {

      const mapa =
        document.getElementById("mapaPantalla");

      const inicio =
        document.getElementById("inicio");


      mapa.style.display = "none";

      inicio.style.display = "flex";

    }

  </script>


</body>

</html>
