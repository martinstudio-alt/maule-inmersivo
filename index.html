<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAULE INMERSIVO</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #000;

    }


    /* =====================================================
       PANTALLA INICIAL
       ===================================================== */

    #inicio {

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 40px;

      background: #000;

    }


    .titulo {

      color: white;

      font-size: clamp(40px, 7vw, 90px);

      font-weight: 600;

      letter-spacing: 8px;

      text-align: center;

    }


    .boton {

      padding: 18px 55px;

      font-size: 24px;

      border: 2px solid white;

      border-radius: 50px;

      background: transparent;

      color: white;

      cursor: pointer;

    }


    .boton:hover {

      background: white;

      color: black;

    }


    /* =====================================================
       PANTALLA MAPA
       ===================================================== */

    #mapaPantalla {

      display: none;

      position: relative;

      width: 100%;
      height: 100%;

      background: #000;

      align-items: center;
      justify-content: center;

    }


    .mapaContenedor {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

    }


    .mapaContenedor img {

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

    }


    /* =====================================================
       ZONA INVISIBLE DEL PUNTO 01
       ===================================================== */

    .zona01 {

      position: absolute;

      left: 74%;
      top: 21%;

      width: 81px;
      height: 81px;

      padding: 0;

      margin: 0;

      background: transparent;

      border: none;

      outline: none;

      box-shadow: none;

      cursor: pointer;

      z-index: 30;

    }


    .zona01:hover,
    .zona01:focus,
    .zona01:active {

      background: transparent;

      border: none;

      outline: none;

      box-shadow: none;

    }


    /* =====================================================
       BOTÓN VOLVER
       ===================================================== */

    .volver {

      position: absolute;

      left: 30px;
      bottom: 30px;

      padding: 12px 28px;

      font-size: 18px;

      border: 1px solid white;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.6);

      color: white;

      cursor: pointer;

      z-index: 50;

    }


    .volver:hover {

      background: white;

      color: black;

    }


    /* =====================================================
       PANTALLA VIDEO
       ===================================================== */

    #videoPantalla {

      display: none;

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background: #000;

      align-items: center;
      justify-content: center;

      z-index: 100;

    }


    #video01 {

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       INICIO
       ===================================================== -->

  <div id="inicio">

    <div class="titulo">

      MAULE INMERSIVO

    </div>


    <button
      class="boton"
      onclick="comenzar()">

      COMENZAR

    </button>

  </div>



  <!-- =====================================================
       MAPA
       ===================================================== -->

  <div id="mapaPantalla">


    <div class="mapaContenedor">

      <img
        src="file:///C:/Users/Juan%20Serrano/Desktop/MAULE%20INMERSIVO/IMAGENES/mapa.webp" 
        alt="Mapa de la Región del Maule">
      >

    </div>


    <!--
      ZONA INVISIBLE DEL PUNTO 01

      No se ve.
      El usuario toca directamente el mapa.
    -->

    <button
      class="zona01"
      aria-label="Punto 01"
      onclick="abrirVideo01()">
    </button>


    <button
      class="volver"
      onclick="volverInicio()">

      VOLVER

    </button>

  </div>



  <!-- =====================================================
       VIDEO 01
       ===================================================== -->

  <div id="videoPantalla">


    <video
      id="video01"
      playsinline
      preload="auto">

      <source
        src="VIDEOS/video%2001.mp4"
        type="video/mp4">

      Tu navegador no puede reproducir este video.

    </video>


  </div>



  <script>


    /* =====================================================
       COMENZAR
       ===================================================== */

    function comenzar() {

      document.getElementById("inicio").style.display = "none";

      document.getElementById("mapaPantalla").style.display = "flex";


      /*
        Intentar pantalla completa.
        El usuario acaba de presionar COMENZAR,
        por lo que Chrome permite esta acción.
      */

      if (document.documentElement.requestFullscreen) {

        document.documentElement
          .requestFullscreen()
          .catch(function(error) {

            console.log(
              "Pantalla completa no disponible:",
              error
            );

          });

      }

    }



    /* =====================================================
       ABRIR VIDEO 01
       ===================================================== */

    function abrirVideo01() {

      const mapa =
        document.getElementById("mapaPantalla");

      const pantallaVideo =
        document.getElementById("videoPantalla");

      const video =
        document.getElementById("video01");


      /*
        Ocultar mapa
      */

      mapa.style.display = "none";


      /*
        Mostrar video
      */

      pantallaVideo.style.display = "flex";


      /*
        Comenzar desde el principio
      */

      video.currentTime = 0;


      /*
        Reproducir video local
      */

      video.play()
        .then(function() {

          console.log("Video 01 iniciado correctamente.");

        })
        .catch(function(error) {

          console.error(
            "ERROR AL REPRODUCIR VIDEO 01:",
            error
          );

        });

    }



    /* =====================================================
       CUANDO TERMINA EL VIDEO
       ===================================================== */

    document
      .getElementById("video01")
      .addEventListener(
        "ended",
        function() {


          /*
            Detener y reiniciar
          */

          this.pause();

          this.currentTime = 0;


          /*
            Ocultar video
          */

          document
            .getElementById("videoPantalla")
            .style.display = "none";


          /*
            Regresar inmediatamente al mapa
          */

          document
            .getElementById("mapaPantalla")
            .style.display = "flex";

        }
      );



    /* =====================================================
       VOLVER AL INICIO
       ===================================================== */

    function volverInicio() {


      /*
        Si por alguna razón el video estuviera activo,
        detenerlo.
      */

      const video =
        document.getElementById("video01");

      video.pause();

      video.currentTime = 0;


      /*
        Ocultar mapa
      */

      document
        .getElementById("mapaPantalla")
        .style.display = "none";


      /*
        Mostrar inicio
      */

      document
        .getElementById("inicio")
        .style.display = "flex";

    }

  </script>


</body>

</html>
