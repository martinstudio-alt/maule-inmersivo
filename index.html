<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAULE INMERSO</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #000;

    }


    /* =========================
       PANTALLA INICIO
       ========================= */

    #inicio {

      width: 100%;

      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 40px;

      background: #000;

    }


    .titulo {

      color: white;

      font-size: clamp(40px, 7vw, 90px);

      font-weight: 600;

      letter-spacing: 8px;

      text-align: center;

    }


    .boton {

      padding: 18px 55px;

      font-size: 24px;

      border: 2px solid white;

      border-radius: 50px;

      background: transparent;

      color: white;

      cursor: pointer;

    }


    .boton:hover {

      background: white;

      color: black;

    }


    /* =========================
       PANTALLA MAPA
       ========================= */

    #mapaPantalla {

      display: none;

      width: 100%;

      height: 100%;

      background: #111;

      position: relative;

      align-items: center;

      justify-content: center;

      flex-direction: column;

    }


    .tituloMapa {

      position: absolute;

      top: 30px;

      left: 0;

      width: 100%;

      text-align: center;

      color: white;

      font-size: clamp(28px, 4vw, 55px);

      letter-spacing: 5px;

      z-index: 10;

    }


    .mapaContenedor {

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .mapaContenedor img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;

    }


    /* =========================
       MARCADOR 01
       ========================= */

    .marcador {

      position: absolute;

      left: 74%;

      top: 21%;

      width: 81px;

      height: 81px;

      border-radius: 50%;

      border: 4px solid white;

      background: transparent;

      color: white;

      font-size: 22px;

      font-weight: bold;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      z-index: 30;

      box-shadow: 0 0 15px rgba(255,255,255,0.7);

      padding: 0;

    }


    .marcador:hover {

      transform: scale(1.1);

    }


    /* =========================
       PANTALLA VIDEO
       ========================= */

    #videoPantalla {

      display: none;

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background: #000;

      z-index: 100;

      align-items: center;

      justify-content: center;

    }


    #video01 {

      width: 100%;

      height: 100%;

      object-fit: contain;

      background: #000;

    }


    /* =========================
       BOTÓN VOLVER
       ========================= */

    .volver {

      position: absolute;

      bottom: 30px;

      left: 30px;

      padding: 12px 28px;

      font-size: 18px;

      border: 1px solid white;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.6);

      color: white;

      cursor: pointer;

      z-index: 200;

    }


    .volver:hover {

      background: white;

      color: black;

    }

  </style>

</head>


<body>


  <!-- =========================
       INICIO
       ========================= -->

  <div id="inicio">

    <div class="titulo">

      MAULE INMERSO

    </div>


    <button
      class="boton"
      onclick="comenzar()">

      COMENZAR

    </button>

  </div>



  <!-- =========================
       MAPA
       ========================= -->

  <div id="mapaPantalla">

    <div class="tituloMapa">

      MAULE

    </div>


    <div class="mapaContenedor">

      <img
        src="https://drive.google.com/thumbnail?id=1RM78Jn1BFrPTOsVHVh2S1JdEvnlowipj&sz=w1920"
        alt="Mapa de la Región del Maule">

    </div>


    <!-- MARCADOR 01 -->

    <button
      class="marcador"
      onclick="abrirVideo01()">

      01

    </button>


    <button
      class="volver"
      onclick="volverInicio()">

      VOLVER

    </button>

  </div>



  <!-- =========================
       VIDEO 01
       ========================= -->

  <div id="videoPantalla">

    <video
      id="video01"
      playsinline
      preload="auto"
      controls="false">

      <source
        src="https://drive.google.com/uc?export=download&id=11i4upX3539zK_nJPzEw9v06o6gCOEIZB"
        type="video/mp4">

      Tu navegador no puede reproducir este video.

    </video>

  </div>



  <script>


    /* =========================
       COMENZAR
       ========================= */

    function comenzar() {

      document.getElementById("inicio").style.display = "none";

      document.getElementById("mapaPantalla").style.display = "flex";

      document.documentElement.requestFullscreen?.();

    }



    /* =========================
       ABRIR VIDEO 01
       ========================= */

    function abrirVideo01() {

      const mapa = document.getElementById("mapaPantalla");

      const videoPantalla = document.getElementById("videoPantalla");

      const video = document.getElementById("video01");


      mapa.style.display = "none";

      videoPantalla.style.display = "flex";


      video.currentTime = 0;


      video.play().catch(error => {

        console.log("No se pudo iniciar automáticamente:", error);

      });

    }



    /* =========================
       VIDEO TERMINADO
       ========================= */

    document.getElementById("video01").addEventListener("ended", function() {

      this.pause();

      this.currentTime = 0;


      document.getElementById("videoPantalla").style.display = "none";

      document.getElementById("mapaPantalla").style.display = "flex";

    });



    /* =========================
       VOLVER AL INICIO
       ========================= */

    function volverInicio() {

      document.getElementById("mapaPantalla").style.display = "none";

      document.getElementById("inicio").style.display = "flex";

    }

  </script>


</body>

</html>
